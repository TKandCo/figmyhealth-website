<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Sơ đồ minh họa công nghệ sấy thăng hoa: đá chuyển thành hơi nước ở nhiệt độ thấp, giữ nguyên cấu trúc quả sung">
  <defs>
    <radialGradient id="bgSTH" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#f4f7f0"/>
      <stop offset="100%" stop-color="#e8efe3"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgSTH)"/>
  <text x="40" y="46" font-family="'Be Vietnam Pro',sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#4c6b4d">QUY TRÌNH SẤY THĂNG HOA</text>

  <!-- panel 1: đông lạnh -->
  <g transform="translate(60,90)">
    <rect width="190" height="190" rx="20" fill="#ffffff" stroke="#e7e0d3"/>
    <g transform="translate(95,72)">
      <path d="M0 -46v92M-40 -23l80 46M40 -23l-80 46" stroke="#7ea07d" stroke-width="7" stroke-linecap="round"/>
      <circle cx="0" cy="-46" r="6" fill="#5f8560"/><circle cx="0" cy="46" r="6" fill="#5f8560"/>
      <circle cx="-40" cy="-23" r="6" fill="#5f8560"/><circle cx="40" cy="23" r="6" fill="#5f8560"/>
      <circle cx="40" cy="-23" r="6" fill="#5f8560"/><circle cx="-40" cy="23" r="6" fill="#5f8560"/>
    </g>
    <text x="95" y="164" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="14.5" font-weight="700" fill="#2b3b2e">1. Đông lạnh sâu</text>
    <text x="95" y="182" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="11.5" fill="#726f66">-35°C đến -45°C</text>
  </g>

  <!-- arrow -->
  <g transform="translate(255,175)">
    <path d="M0 10h70" stroke="#dda44f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrSTH)"/>
  </g>
  <defs><marker id="arrSTH" markerWidth="10" markerHeight="10" refX="6" refY="5" orient="auto"><path d="M0 0l8 5-8 5z" fill="#dda44f"/></marker></defs>

  <!-- panel 2: thăng hoa (sublimation) trong buồng chân không -->
  <g transform="translate(335,90)">
    <rect width="190" height="190" rx="20" fill="#ffffff" stroke="#e7e0d3"/>
    <rect x="35" y="115" width="120" height="45" rx="8" fill="#f3e3e7"/>
    <text x="95" y="143" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#7a4457">lát sung khô</text>
    <g fill="none" stroke="#5f8560" stroke-width="2.4" stroke-linecap="round" opacity=".85">
      <path d="M60 108c-6-14 4-20 0-32"/>
      <path d="M85 108c4-16-6-22-2-34"/>
      <path d="M110 108c-5-15 5-21 1-33"/>
      <path d="M135 108c5-14-5-20-1-32"/>
    </g>
    <rect x="20" y="20" width="150" height="150" rx="16" fill="none" stroke="#7ea07d" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="95" y="182" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="14.5" font-weight="700" fill="#2b3b2e">2. Thăng hoa</text>
  </g>
  <text x="430" y="252" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="11.5" fill="#726f66">đá → hơi nước, áp suất chân không, nhiệt thấp</text>

  <!-- arrow -->
  <g transform="translate(530,175)">
    <path d="M0 10h70" stroke="#dda44f" stroke-width="3" stroke-linecap="round" marker-end="url(#arrSTH)"/>
  </g>

  <!-- panel 3: thành phẩm -->
  <g transform="translate(610,90)">
    <rect width="190" height="190" rx="20" fill="#ffffff" stroke="#e7e0d3"/>
    <path d="M55 150 Q50 120 65 110 L125 110 Q140 120 135 150 Z" fill="#5f8560"/>
    <path d="M65 110 Q60 96 75 90 L115 90 Q130 96 125 110Z" fill="#2b3b2e"/>
    <rect x="70" y="122" width="50" height="24" rx="5" fill="#fbf7ef"/>
    <circle cx="95" cy="60" r="20" fill="none" stroke="#c8873a" stroke-width="3"/>
    <path d="M87 60l6 6 12-13" fill="none" stroke="#c8873a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="95" y="182" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="14.5" font-weight="700" fill="#2b3b2e">3. Bột thành phẩm</text>
  </g>

  <text x="400" y="330" text-anchor="middle" font-family="'Fraunces',serif" font-size="21" font-weight="600" fill="#2b3b2e">Sấy thăng hoa: giữ cấu trúc, giữ chất xơ</text>
  <text x="400" y="358" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="13.5" fill="#4a4842">Loại bỏ 95–99,5% lượng nước mà không dùng nhiệt độ cao</text>
</svg>
