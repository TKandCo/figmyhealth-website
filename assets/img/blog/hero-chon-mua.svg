<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Minh họa kính lúp soi nhãn sản phẩm thực phẩm bổ sung cùng dấu tích kiểm tra thành phần, hạn dùng và giấy tờ công bố">
  <defs>
    <radialGradient id="bgCM" cx="60%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#f4f7f0"/>
      <stop offset="100%" stop-color="#faecd4"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgCM)"/>

  <!-- nhãn sản phẩm -->
  <g transform="translate(240,120)">
    <rect width="220" height="290" rx="18" fill="#ffffff" stroke="#e7e0d3" stroke-width="2"/>
    <rect x="20" y="24" width="180" height="14" rx="6" fill="#2b3b2e"/>
    <rect x="20" y="50" width="120" height="10" rx="5" fill="#e7e0d3"/>
    <line x1="20" y1="86" x2="200" y2="86" stroke="#e7e0d3" stroke-width="2"/>
    <rect x="20" y="100" width="160" height="9" rx="4.5" fill="#dfe6db"/>
    <rect x="20" y="118" width="140" height="9" rx="4.5" fill="#dfe6db"/>
    <rect x="20" y="136" width="150" height="9" rx="4.5" fill="#dfe6db"/>
    <rect x="20" y="160" width="90" height="9" rx="4.5" fill="#f3e3e7"/>
    <rect x="20" y="178" width="110" height="9" rx="4.5" fill="#f3e3e7"/>
    <rect x="20" y="210" width="180" height="1.5" fill="#e7e0d3"/>
    <rect x="20" y="226" width="130" height="10" rx="5" fill="#e8efe3"/>
    <rect x="20" y="246" width="100" height="10" rx="5" fill="#e8efe3"/>
  </g>

  <!-- kính lúp -->
  <g transform="translate(430,230)">
    <circle cx="0" cy="0" r="70" fill="rgba(255,255,255,.35)" stroke="#4c6b4d" stroke-width="8"/>
    <line x1="48" y1="48" x2="110" y2="110" stroke="#4c6b4d" stroke-width="14" stroke-linecap="round"/>
    <path d="M-24 4l16 16 34-38" fill="none" stroke="#5f8560" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="70" y="70" font-family="'Fraunces',serif" font-size="19" font-weight="600" fill="#2b3b2e">Đọc kỹ nhãn</text>
  <text x="70" y="94" font-family="'Be Vietnam Pro',sans-serif" font-size="13" fill="#726f66">trước khi chọn thực phẩm bổ sung</text>
</svg>
