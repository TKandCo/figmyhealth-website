<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Biểu đồ minh họa khoảng cách giữa lượng chất xơ khuyến nghị mỗi ngày và lượng thực tế người Việt/người Mỹ đang tiêu thụ">
  <rect width="800" height="500" fill="#fffdf9"/>
  <text x="40" y="46" font-family="'Be Vietnam Pro',sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#4c6b4d">KHUYẾN NGHỊ SO VỚI THỰC TẾ TIÊU THỤ</text>

  <!-- bar chart -->
  <g transform="translate(120,120)">
    <!-- Nữ khuyến nghị 25g -->
    <rect x="0" y="0" width="90" height="260" rx="10" fill="#e8efe3"/>
    <rect x="0" y="112" width="90" height="148" rx="10" fill="#5f8560"/>
    <text x="45" y="-14" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="13" font-weight="700" fill="#2b3b2e">25g</text>
    <text x="45" y="284" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="12" fill="#4a4842">Nữ — khuyến nghị</text>

    <!-- Nam khuyến nghị 38g -->
    <rect x="140" y="-56" width="90" height="316" rx="10" fill="#e8efe3"/>
    <rect x="140" y="20" width="90" height="240" rx="10" fill="#5f8560"/>
    <text x="185" y="-70" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="13" font-weight="700" fill="#2b3b2e">38g</text>
    <text x="185" y="284" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="12" fill="#4a4842">Nam — khuyến nghị</text>

    <!-- thực tế trung bình 10-15g -->
    <rect x="340" y="0" width="90" height="260" rx="10" fill="#f3e3e7"/>
    <rect x="340" y="212" width="90" height="48" rx="10" fill="#a86c7e"/>
    <text x="385" y="-14" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="13" font-weight="700" fill="#7a4457">10–15g</text>
    <text x="385" y="284" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="12" fill="#4a4842">Thực tế tiêu thụ TB</text>

    <line x1="0" y1="260" x2="430" y2="260" stroke="#e7e0d3" stroke-width="2"/>
  </g>

  <text x="400" y="450" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="13" fill="#726f66">Số liệu tham khảo: USDA · Harvard Health (2019) — xem nguồn trích dẫn bên dưới bài viết</text>
</svg>
