<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Minh họa cây sung với các bộ phận: quả, lá, nhựa mủ, vỏ và rễ">
  <defs>
    <radialGradient id="bgBP" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#eef3ea"/>
      <stop offset="100%" stop-color="#f4f7f0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgBP)"/>

  <!-- trunk -->
  <path d="M380 500c-4-90 2-170 18-230 10-38 8-70-6-108" fill="none" stroke="#8a6a4e" stroke-width="26" stroke-linecap="round"/>
  <path d="M380 500c-4-90 2-170 18-230 10-38 8-70-6-108" fill="none" stroke="#a3805f" stroke-width="10" stroke-linecap="round" opacity=".5"/>
  <!-- roots -->
  <g stroke="#8a6a4e" stroke-width="14" stroke-linecap="round" fill="none" opacity=".85">
    <path d="M378 498c-30 6-58 18-84 10"/>
    <path d="M382 498c26 8 54 16 78 6"/>
    <path d="M380 498c-6 10-8 2-2-4"/>
  </g>

  <!-- branches -->
  <path d="M392 162c-40-28-86-36-138-24M392 162c46-30 96-30 150-4" fill="none" stroke="#8a6a4e" stroke-width="12" stroke-linecap="round"/>

  <!-- leaves -->
  <g fill="#5e8158">
    <path d="M230 118c26-30 60-38 90-24-6 34-32 56-64 60-30 4-46-12-26-36z"/>
    <path d="M560 112c-24-32-58-42-90-30 4 34 30 58 62 64 30 6 48-10 28-34z"/>
    <path d="M300 92c10-24 30-38 54-40 2 24-10 46-32 56-20 10-30 2-22-16z"/>
  </g>

  <!-- fruit -->
  <g transform="translate(392,205)">
    <path d="M0 -46c36 8 58 42 54 80-4 38-36 64-68 60-32-4-56-38-52-76C-62-20-36-54 0-46z" fill="#7a4457"/>
  </g>

  <!-- latex droplet -->
  <g transform="translate(330,200)">
    <path d="M0 0c8 12 14 24 14 34a14 14 0 1 1-28 0c0-10 6-22 14-34z" fill="#fdf8ee" stroke="#dda44f" stroke-width="2.5"/>
  </g>

  <!-- bark patch -->
  <rect x="360" y="330" width="40" height="70" rx="8" fill="#a3805f" opacity=".55"/>
  <path d="M366 340l10 16-8 18 10 14" fill="none" stroke="#5c4530" stroke-width="2" opacity=".6"/>

  <!-- labels -->
  <g font-family="'Be Vietnam Pro',sans-serif" font-size="13" font-weight="700">
    <g transform="translate(470,190)">
      <rect width="112" height="40" rx="20" fill="#ffffff" opacity=".92"/>
      <circle cx="22" cy="20" r="10" fill="#f3e3e7"/>
      <text x="40" y="25" fill="#2b3b2e" font-size="12.5">Quả</text>
    </g>
    <g transform="translate(70,140)">
      <rect width="112" height="40" rx="20" fill="#ffffff" opacity=".92"/>
      <circle cx="22" cy="20" r="10" fill="#e8efe3"/>
      <text x="40" y="25" fill="#2b3b2e" font-size="12.5">Lá</text>
    </g>
    <g transform="translate(196,222)">
      <rect width="132" height="40" rx="20" fill="#ffffff" opacity=".92"/>
      <circle cx="22" cy="20" r="10" fill="#faecd4"/>
      <text x="40" y="25" fill="#2b3b2e" font-size="12.5">Nhựa mủ</text>
    </g>
    <g transform="translate(420,352)">
      <rect width="112" height="40" rx="20" fill="#ffffff" opacity=".92"/>
      <circle cx="22" cy="20" r="10" fill="#efe4d6"/>
      <text x="40" y="25" fill="#2b3b2e" font-size="12.5">Vỏ cây</text>
    </g>
    <g transform="translate(180,440)">
      <rect width="112" height="40" rx="20" fill="#ffffff" opacity=".92"/>
      <circle cx="22" cy="20" r="10" fill="#efe4d6"/>
      <text x="40" y="25" fill="#2b3b2e" font-size="12.5">Rễ cây</text>
    </g>
  </g>

  <text x="60" y="470" font-family="'Fraunces',serif" font-size="15" fill="#726f66" font-style="italic">Ficus carica — các bộ phận của cây sung</text>
</svg>
