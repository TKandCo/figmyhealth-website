<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" role="img" aria-label="Minh họa quả sung bổ đôi cùng biểu tượng dưỡng chất: chất xơ, kali, chất chống oxy hoá">
  <defs>
    <radialGradient id="bgQS" cx="70%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#faecd4"/>
      <stop offset="100%" stop-color="#f4f7f0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgQS)"/>

  <!-- quả sung nguyên trái -->
  <g transform="translate(190,270)">
    <path d="M0 -130c62 14 100 74 94 138-6 66-62 112-118 106-56-8-96-66-88-132C-104-84-62-142 0-130z" fill="#7a4457"/>
    <path d="M-6-130c-6-18-2-34 12-46" stroke="#3a4f3c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <ellipse cx="30" cy="-40" rx="46" ry="80" fill="#93576a" opacity=".5"/>
  </g>

  <!-- quả sung bổ đôi -->
  <g transform="translate(430,260)">
    <path d="M0 -140c66 0 118 62 118 140S66 140 0 140c0 0 0-280 0-280z" fill="#f3e3e7" stroke="#a86c7e" stroke-width="3"/>
    <circle cx="30" cy="-40" r="5" fill="#c8873a"/><circle cx="55" cy="-10" r="5" fill="#c8873a"/>
    <circle cx="65" cy="30" r="5" fill="#c8873a"/><circle cx="48" cy="65" r="5" fill="#c8873a"/>
    <circle cx="15" cy="90" r="5" fill="#c8873a"/><circle cx="70" cy="-55" r="4" fill="#dda44f"/>
    <circle cx="80" cy="5" r="4" fill="#dda44f"/><circle cx="35" cy="-75" r="4" fill="#dda44f"/>
    <path d="M0 -140c66 0 118 62 118 140S66 140 0 140" fill="none" stroke="#7a4457" stroke-width="10"/>
  </g>

  <!-- nutrient chips -->
  <g font-family="'Be Vietnam Pro',sans-serif" font-size="13" font-weight="700">
    <g transform="translate(580,90)">
      <rect width="170" height="52" rx="26" fill="#ffffff" opacity=".92"/>
      <circle cx="30" cy="26" r="16" fill="#e8efe3"/>
      <text x="30" y="31" text-anchor="middle" fill="#4c6b4d" font-size="14">Fe</text>
      <text x="58" y="31" fill="#2b3b2e">Chất xơ tự nhiên</text>
    </g>
    <g transform="translate(560,160)">
      <rect width="170" height="52" rx="26" fill="#ffffff" opacity=".92"/>
      <circle cx="30" cy="26" r="16" fill="#faecd4"/>
      <text x="30" y="31" text-anchor="middle" fill="#c8873a" font-size="13">K</text>
      <text x="58" y="31" fill="#2b3b2e">Kali, khoáng chất</text>
    </g>
    <g transform="translate(590,230)">
      <rect width="170" height="52" rx="26" fill="#ffffff" opacity=".92"/>
      <circle cx="30" cy="26" r="16" fill="#f3e3e7"/>
      <path d="M22 26l6 6 12-13" transform="translate(0,0)" fill="none" stroke="#a86c7e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="58" y="31" fill="#2b3b2e">Polyphenol</text>
    </g>
  </g>

  <text x="60" y="440" font-family="'Fraunces',serif" font-size="15" fill="#726f66" font-style="italic">Ficus carica — quả sung</text>
</svg>
