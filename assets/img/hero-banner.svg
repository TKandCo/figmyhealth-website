<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" width="100%" height="100%" role="img" aria-label="Banner: hũ bột quả sung và cỏ sữa lá lớn cùng quả sung tươi và lá thảo mộc">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#f4f7f0"/>
      <stop offset="100%" stop-color="#e8efe3"/>
    </radialGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f8560"/>
      <stop offset="100%" stop-color="#3a4f3c"/>
    </linearGradient>
  </defs>
  <rect width="560" height="560" rx="34" fill="url(#bg1)"/>
  <circle cx="440" cy="120" r="120" fill="#faecd4" opacity=".7"/>
  <circle cx="90" cy="470" r="110" fill="#f3e3e7" opacity=".7"/>

  <!-- lá thảo mộc bay nhẹ -->
  <g opacity=".85">
    <ellipse cx="120" cy="120" rx="26" ry="13" fill="#7ea07d" transform="rotate(-25 120 120)"/>
    <ellipse cx="90" cy="160" rx="18" ry="9" fill="#5f8560" transform="rotate(10 90 160)"/>
    <ellipse cx="470" cy="420" rx="24" ry="12" fill="#7ea07d" transform="rotate(18 470 420)"/>
  </g>

  <!-- quả sung tươi bên trái -->
  <g transform="translate(95,330)">
    <path d="M0 -78c38 9 62 46 58 86-4 40-38 68-72 64-34-4-58-40-54-80C-64-48-36-86 0-78z" fill="#7a4457"/>
    <path d="M0 -78c20 4 36 18 44 36-11 29-16 64-4 102-33 7-64-13-75-44-11-33 2-77 35-94z" fill="#93576a" opacity=".55"/>
    <path d="M-6 -78c-4-11-2-22 7-29" stroke="#3a4f3c" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- hũ / túi sản phẩm chính giữa -->
  <g transform="translate(210,150)">
    <path d="M10 40 Q0 10 24 0 L136 0 Q160 10 150 40 L166 330 Q168 360 138 362 L22 362 Q-8 360 -6 330 Z" fill="url(#pouchG)"/>
    <path d="M24 0 Q0 10 10 40 L18 90 L152 90 L150 40 Q160 10 136 0Z" fill="#2b3b2e"/>
    <rect x="30" y="120" width="110" height="150" rx="16" fill="#fbf7ef"/>
    <text x="85" y="170" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#2b3b2e" font-weight="700">FigMyHealth</text>
    <text x="85" y="196" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#7a4457" font-style="italic">Bột Quả Sung</text>
    <text x="85" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#7a4457" font-style="italic">&amp; Cỏ Sữa Lá Lớn</text>
    <circle cx="85" cy="240" r="20" fill="#e8efe3"/>
    <path d="M85 226c7 5 11 12 11 19a11 11 0 1 1-22 0c0-7 4-14 11-19z" fill="#93576a"/>
  </g>

  <!-- bột rắc nhẹ phía dưới hũ -->
  <g fill="#dda44f" opacity=".8">
    <circle cx="240" cy="520" r="4"/><circle cx="260" cy="530" r="3"/><circle cx="285" cy="518" r="4"/>
    <circle cx="305" cy="532" r="3"/><circle cx="325" cy="516" r="4"/><circle cx="350" cy="528" r="3"/>
  </g>

  <!-- nhánh lá cỏ sữa bên phải -->
  <g transform="translate(400,300)">
    <path d="M0 90c40 6 78-6 100-30" stroke="#4c6b4d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="18" cy="78" rx="16" ry="9" fill="#5f8560" transform="rotate(-15 18 78)"/>
    <ellipse cx="46" cy="66" rx="17" ry="9" fill="#7ea07d" transform="rotate(10 46 66)"/>
    <ellipse cx="76" cy="56" rx="16" ry="9" fill="#5f8560" transform="rotate(-10 76 56)"/>
  </g>
</svg>
