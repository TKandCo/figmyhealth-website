<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="100%" height="100%" role="img" aria-label="So sánh cấu trúc: sấy thăng hoa giữ cấu trúc xốp nguyên vẹn, sấy nhiệt truyền thống làm co rút và xẹp cấu trúc tế bào">
  <rect width="800" height="420" fill="#fffdf9"/>
  <text x="40" y="40" font-family="'Be Vietnam Pro',sans-serif" font-size="13" font-weight="700" letter-spacing="1" fill="#4c6b4d">CẤU TRÚC SAU SẤY</text>

  <!-- Left: freeze-dried, porous -->
  <g transform="translate(60,80)">
    <rect width="300" height="260" rx="18" fill="#f4f7f0" stroke="#e8efe3"/>
    <text x="150" y="34" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-weight="700" font-size="15.5" fill="#2b3b2e">Sấy thăng hoa</text>
    <!-- porous sponge-like circles -->
    <g fill="none" stroke="#7ea07d" stroke-width="2.2">
      <circle cx="80" cy="90" r="22"/><circle cx="140" cy="80" r="16"/><circle cx="190" cy="100" r="24"/>
      <circle cx="240" cy="85" r="14"/><circle cx="100" cy="140" r="18"/><circle cx="160" cy="150" r="26"/>
      <circle cx="220" cy="150" r="16"/><circle cx="70" cy="190" r="16"/><circle cx="130" cy="200" r="14"/>
      <circle cx="190" cy="205" r="20"/><circle cx="245" cy="195" r="15"/>
    </g>
    <text x="150" y="246" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="12.5" fill="#4a4842">Cấu trúc xốp, giữ nguyên khung tế bào</text>
  </g>

  <!-- Right: hot air dried, collapsed -->
  <g transform="translate(440,80)">
    <rect width="300" height="260" rx="18" fill="#f3e3e7" stroke="#eadade"/>
    <text x="150" y="34" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-weight="700" font-size="15.5" fill="#7a4457">Sấy nhiệt truyền thống</text>
    <g fill="none" stroke="#a86c7e" stroke-width="2.2">
      <path d="M55 90c20-8 30 8 46-2s24 10 40-4 30 6 44-6 28 8 45-2"/>
      <path d="M55 130c20-8 30 8 46-2s24 10 40-4 30 6 44-6 28 8 45-2"/>
      <path d="M55 170c20-8 30 8 46-2s24 10 40-4 30 6 44-6 28 8 45-2"/>
      <path d="M55 205c20-8 30 8 46-2s24 10 40-4 30 6 44-6 28 8 45-2"/>
    </g>
    <text x="150" y="246" text-anchor="middle" font-family="'Be Vietnam Pro',sans-serif" font-size="12.5" fill="#4a4842">Nhiệt cao làm co rút, xẹp cấu trúc tế bào</text>
  </g>
</svg>
